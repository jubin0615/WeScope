# WS-01 비밀값 노출 — analyzers/secrets (RULES.md §2)
- id: secret-env-file
  category: WS-01
  cwe: CWE-540
  severity: CRITICAL
  confidence: Likely
  title_ko: "환경변수 파일(.env)이 저장소에 들어가 있어요"
  tech_name_ko: "환경변수 파일 노출"
  why_ko: "저장소를 본 사람 누구나 DB 비밀번호·API 키 같은 운영 비밀값을 그대로 가져갈 수 있어요. 한 번 커밋되면 지워도 Git 기록에 남아요."
  fix_ko: ".env를 .gitignore에 추가하고 저장소에서 빼세요(git rm --cached .env). 이미 커밋됐다면 안에 있던 키를 모두 재발급하세요."
  avoid_ko: "파일만 지우고 키를 그대로 쓰지 마세요. Git 기록에 남은 값은 이미 노출된 것으로 봐야 해요."
  fix_example: |
    # .gitignore
    .env
    .env.*
    !.env.example
  limitations_ko: "파일 내용은 열어 보지 않았어요. 어떤 키가 들어 있는지는 직접 확인해야 해요."

- id: secret-credential-file
  category: WS-01
  cwe: CWE-540
  severity: CRITICAL
  confidence: Likely
  title_ko: "인증 키 파일이 저장소에 들어가 있어요"
  tech_name_ko: "인증 파일 노출 (서비스 계정·개인키·tfstate)"
  why_ko: "서비스 계정 키나 개인키가 있으면 누구나 내 클라우드·서버에 내 권한으로 접속할 수 있어요."
  fix_ko: "파일을 저장소에서 빼고 .gitignore에 등록한 뒤, 해당 키를 폐기하고 새로 발급하세요. 키는 비밀 관리 서비스나 환경변수로 전달하세요."
  avoid_ko: "파일 이름만 바꾸거나 다른 폴더로 옮기지 마세요."
  fix_example: |
    # .gitignore
    *.pem
    *.key
    serviceAccountKey*.json
    terraform.tfstate*
  limitations_ko: "파일 내용은 열어 보지 않았어요. 키가 이미 폐기됐는지는 확인하지 않았어요."

- id: secret-hardcoded
  category: WS-01
  cwe: CWE-798
  severity: HIGH
  confidence: Likely
  title_ko: "비밀키가 코드에 그대로 들어 있어요"
  tech_name_ko: "하드코딩된 인증정보"
  why_ko: "저장소를 본 누구나 이 키로 외부 서비스를 쓰거나 요금을 발생시킬 수 있어요. 한 번 커밋되면 지워도 Git 기록에 남아요."
  fix_ko: "키를 바로 폐기·재발급하고, 환경변수로 옮긴 뒤 .env를 .gitignore에 추가하세요."
  avoid_ko: "코드에서 키 줄만 지우고 끝내지 마세요. 이미 노출된 키는 재발급해야 해요."
  fix_example: |
    # 수정 전
    client = OpenAI(api_key="sk-abcd...")
    # 수정 후
    client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])
  limitations_ko: "키가 실제로 유효한지는 확인하지 않습니다."

- id: secret-frontend-env
  category: WS-01
  cwe: CWE-200
  severity: HIGH
  confidence: Likely
  title_ko: "브라우저로 나가는 환경변수에 비밀값 이름이 붙어 있어요"
  tech_name_ko: "프론트엔드 환경변수 노출 (NEXT_PUBLIC_ 등)"
  why_ko: "NEXT_PUBLIC_·VITE_ 같은 접두어가 붙은 값은 빌드할 때 브라우저 코드에 그대로 들어가서, 사이트 방문자 누구나 볼 수 있어요."
  fix_ko: "비밀값은 접두어 없는 서버 전용 환경변수로 옮기고, 서버 코드(API 라우트·서버 함수)에서만 읽으세요. 이미 배포됐다면 키를 재발급하세요."
  avoid_ko: "변수 이름만 바꾸고 계속 브라우저 코드에서 쓰지 마세요."
  fix_example: |
    # 수정 전
    NEXT_PUBLIC_STRIPE_SECRET_KEY=...
    # 수정 후 (서버에서만 사용)
    STRIPE_SECRET_KEY=...
  limitations_ko: "변수 이름으로 판단했어요. 실제로 브라우저 번들에 들어갔는지는 빌드해 보지 않았어요."

- id: secret-client-bundle
  category: WS-01
  cwe: CWE-798
  severity: CRITICAL
  confidence: Likely
  title_ko: "서버 전용 키가 브라우저로 전달되는 코드에 있어요"
  tech_name_ko: "클라이언트 번들의 고권한 키"
  why_ko: "브라우저 코드에 들어간 키는 개발자 도구로 누구나 꺼낼 수 있어요. service_role·sk- 키는 데이터 전체나 결제 계정을 마음대로 쓸 수 있는 권한이에요."
  fix_ko: "키를 바로 재발급하고, 그 키가 필요한 호출은 서버 API로 옮기세요. 브라우저에는 공개용 키(anon·publishable)만 두세요."
  avoid_ko: "키를 난독화하거나 base64로 감추지 마세요. 브라우저에 있는 한 꺼낼 수 있어요."
  fix_example: |
    // 수정 전 (components/Admin.tsx)
    const supabase = createClient(url, "eyJh...service_role...")
    // 수정 후: 서버 라우트에서만
    const supabase = createClient(url, process.env.SUPABASE_SERVICE_ROLE_KEY)
  limitations_ko: "파일 위치와 \"use client\" 표시로 브라우저 코드인지 판단했어요."

- id: secret-infra-config
  category: WS-01
  cwe: CWE-798
  severity: HIGH
  confidence: Likely
  title_ko: "배포·CI 설정 파일에 비밀번호가 그대로 적혀 있어요"
  tech_name_ko: "인프라·CI 설정의 하드코딩된 비밀값"
  why_ko: "docker-compose·Dockerfile·CI 설정은 저장소와 함께 공유돼요. 여기 적힌 비밀번호는 저장소를 본 누구나 알 수 있어요."
  fix_ko: "값을 CI 비밀 저장소(GitHub Actions secrets 등)나 배포 환경변수로 옮기고 설정 파일에서는 참조만 하세요."
  avoid_ko: "Dockerfile의 ENV·ARG에 키를 넣지 마세요. 이미지 기록에 남아요."
  fix_example: |
    # 수정 전
    env:
      API_KEY: sk-abcd...
    # 수정 후
    env:
      API_KEY: ${{ secrets.API_KEY }}
  limitations_ko: "값이 실제 운영 비밀번호인지 로컬 개발용인지는 구분하지 않았어요."

- id: secret-dev-tool
  category: WS-01
  cwe: CWE-798
  severity: HIGH
  confidence: Likely
  title_ko: "개발 도구 설정 파일에 인증 토큰이 들어 있어요"
  tech_name_ko: "개발 도구 설정의 인증정보 (.npmrc·.netrc 등)"
  why_ko: "패키지 저장소·서버 접속 토큰이 노출되면 내 계정으로 패키지를 올리거나 서버에 접속할 수 있어요."
  fix_ko: "토큰을 재발급하고 설정 파일에는 환경변수 참조(${NPM_TOKEN})만 남기세요. 개인 설정 파일은 .gitignore에 추가하세요."
  avoid_ko: "개인 홈 폴더용 설정 파일을 프로젝트에 복사해 커밋하지 마세요."
  fix_example: |
    # .npmrc 수정 전
    //registry.npmjs.org/:_authToken=npm_abcd...
    # 수정 후
    //registry.npmjs.org/:_authToken=${NPM_TOKEN}
  limitations_ko: "토큰이 유효한지는 확인하지 않았어요."

- id: secret-data-file
  category: WS-01
  cwe: CWE-538
  severity: MEDIUM
  confidence: Potential
  title_ko: "데이터베이스·로그 파일이 저장소에 들어가 있어요"
  tech_name_ko: "데이터·로그 파일 노출"
  why_ko: "DB 파일·덤프·로그에는 사용자 개인정보나 비밀번호 해시, 토큰이 들어 있을 수 있어요."
  fix_ko: "파일을 저장소에서 빼고 .gitignore에 추가하세요. 실제 사용자 데이터가 들어 있었다면 영향 범위를 확인하세요."
  avoid_ko: "개발용이라도 실제 데이터를 복사한 DB 파일을 커밋하지 마세요."
  fix_example: |
    # .gitignore
    *.sqlite
    *.db
    *.log
  limitations_ko: "파일 내용은 열어 보지 않았어요. 민감한 데이터가 실제로 있는지는 직접 확인해야 해요."

- id: secret-doc
  category: WS-01
  cwe: CWE-798
  severity: HIGH
  confidence: Likely
  title_ko: "문서에 실제 형식의 키가 적혀 있어요"
  tech_name_ko: "문서의 하드코딩된 인증정보"
  why_ko: "README 같은 문서는 가장 많이 읽히는 파일이에요. 예시처럼 보여도 실제 형식의 키라면 그대로 쓸 수 있어요."
  fix_ko: "키를 재발급하고 문서에는 'YOUR_API_KEY' 같은 자리표시만 적으세요."
  avoid_ko: "키 일부만 가리는 방식으로 고치지 마세요. 원래 키는 재발급해야 해요."
  fix_example: |
    # 수정 전
    curl -H "Authorization: Bearer sk-abcd..."
    # 수정 후
    curl -H "Authorization: Bearer $OPENAI_API_KEY"
  limitations_ko: "형식으로 판단했어요. 키가 유효한지는 확인하지 않았어요."

- id: git-hygiene
  category: WS-01
  cwe: null
  severity: MEDIUM
  confidence: Likely
  title_ko: ".gitignore가 비밀 파일을 막지 못하고 있어요"
  tech_name_ko: "Git 위생 (.gitignore 누락·미등록 패턴)"
  why_ko: "지금은 문제가 없어도 .env나 키 파일을 만드는 순간 실수로 커밋될 수 있어요."
  fix_ko: ".gitignore에 .env*, *.pem, *.key, serviceAccountKey*.json, *.tfstate 패턴을 추가하세요."
  avoid_ko: "!.env 같은 예외 규칙으로 실제 .env를 다시 포함시키지 마세요."
  fix_example: |
    # .gitignore
    .env
    .env.*
    !.env.example
    *.pem
    *.key
    serviceAccountKey*.json
    *.tfstate*
  limitations_ko: "저장소 맨 위의 .gitignore만 확인했어요. 하위 폴더나 전역 gitignore 설정은 보지 않았어요."
