  - {rule: inject-xss-template, file: dockerized_labs/sensitive_data_exposure/templates/login.html, verdict: fp, why: "Django 폼 필드 위젯 출력 (이미 안전 처리된 HTML)"}
  - {rule: inject-xss-template, file: dockerized_labs/ssrf_lab/templates/lab2.html, verdict: real, why: "SSRF로 가져온 응답을 |safe로 그대로 출력"}
