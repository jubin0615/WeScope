  - {rule: "secret-*", verdict: real, why: "실습 앱 코드·설정·DB 파일에 하드코딩·커밋된 비밀값"}
  - {rule: "config-*", verdict: real, why: "디버그·약한 비밀키·쿠키 플래그·오류 노출·ALLOWED_HOSTS 등 실제 위험한 설정"}
  - {rule: inject-open-redirect, verdict: real, why: "Referer로 되돌아가는 리다이렉트 (낮음)"}

