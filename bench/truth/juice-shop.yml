# static 구분
#   static      코드에 흔적이 있고 규칙 기반 정적 분석으로 찾을 수 있는 것 → 탐지율의 분모
#   logic       코드에는 있지만 업무 로직을 이해해야 하는 것 (규칙으로는 사실상 불가, ChatGPT 보완 탐지 대상)
#   runtime     런타임·데이터·OSINT·클라이언트 동작이라 정적으로 찾을 수 없는 것
#   unsupported We-Scope 지원 범위 밖 (의존성 취약점 SCA, Solidity, 컨테이너 이미지)
# rules: 이 항목을 맞혔다고 볼 We-Scope rule_id. 비어 있으면 대응 규칙이 없다.
# 일치 판정: 같은 파일 + line(~end) ±3줄 + rules 중 하나. line 0은 파일 단위. also는 같은 취약점의 다른 위치.
# source: review = 챌린지가 아니라 코드 검토로 넣은 항목. OWASP 2025는 cwe에서 wescope.taxonomy.owasp.classify로 계산.
