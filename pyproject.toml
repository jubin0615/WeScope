[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wescope"
version = "0.1.0"
description = "바이브코딩 웹앱을 내 PC에서 점검하는 로컬 보안 진단 도구"
requires-python = ">=3.11"
license = "MIT"
# semgrep: 입력값 주입(WS-05) 등 핵심 검사 도구라 함께 설치한다. 실행에 실패하면 semgrep Analyzer만 skipped로 표시된다.
dependencies = ["pathspec>=0.12", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29", "semgrep>=1.185"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
wescope = "wescope.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wescope = ["rules/**/*.yml", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
